name: Main Branch Protection

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        env:
          # GITHUB_HEAD_REF is set on pull_request events, GITHUB_REF_NAME on push events
          BRANCH: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
        run: |
          if [[ $BRANCH != staging ]] && ! [[ $BRANCH =~ ^hotfix/ ]];
          then
            echo "Error: Branch must be 'staging' or 'hotfix/' (got '$BRANCH')"
            exit 1
          fi
