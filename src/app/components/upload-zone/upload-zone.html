@if (downloadUrl()) {
  <div class="space-y-4">
    <p-message severity="success" styleClass="w-full font-bold">UPLOAD COMPLETE</p-message>

    <div>
      <label class="text-[10px] font-bold block mb-1">DOWNLOAD LINK</label>
      <p-inputgroup>
        <input id="res-url" pInputText readonly class="text-sm" [value]="downloadUrl()" #resUrl />
        <button pButton severity="secondary" (click)="copy(resUrl)">
          <span pButtonLabel>COPY</span>
        </button>
      </p-inputgroup>
    </div>

    @if (siteUrl()) {
      <div>
        <label class="text-[10px] font-bold block mb-1">SITE LINK</label>
        <p-inputgroup>
          <input
            id="site-url"
            pInputText
            readonly
            class="text-sm"
            [value]="siteUrl()"
            #siteUrlInput
          />
          <button pButton severity="secondary" (click)="copy(siteUrlInput)">
            <span pButtonLabel>COPY</span>
          </button>
        </p-inputgroup>
      </div>
    }

    <button id="newUploadBtn" pButton class="w-full justify-center" (click)="reload()">
      <span pButtonLabel>NEW UPLOAD</span>
    </button>
  </div>
} @else {
  <div
    id="drop-zone"
    class="mb-4 border-2 border-dashed border-surface-300 rounded-md p-10 text-center cursor-pointer transition-colors"
    [class.border-primary]="dragging()"
    [class.bg-primary-50]="dragging()"
    (click)="fileInput.click()"
    (dragover)="onDragOver($event)"
    (dragleave)="dragging.set(false)"
    (drop)="onDrop($event)"
  >
    <input type="file" id="fileInput" class="hidden" #fileInput (change)="onFileSelected()" />

    <div id="dz-content">
      <span id="dz-text" class="text-sm">{{ dropZoneText() }}</span>
    </div>

    @if (uploading()) {
      <div id="progress-container" class="mt-3">
        <p-progressbar [value]="percent()" [showValue]="false" styleClass="h-2" />
      </div>

      <div class="flex justify-between items-center mt-1">
        <div id="progress-text" class="text-[10px] font-bold">{{ percent() }}%</div>
        <div id="stats-text" class="text-[10px] font-bold uppercase">
          <span id="speed-text">{{ speed() }}</span>
          <span class="mx-1 opacity-30">|</span>
          <span id="eta-text">{{ eta() }}</span>
        </div>
      </div>
    }
  </div>

  @if (isArchive()) {
    <label class="mb-4 flex cursor-pointer items-start gap-2 text-sm">
      <input
        type="checkbox"
        class="mt-1"
        [checked]="hosted()"
        [disabled]="uploading()"
        (change)="hosted.set($any($event.target).checked)"
      />
      <span>
        <span class="font-bold">Host contents as a site</span>
        <span class="block text-xs text-surface-500">
          Serves the files in this zip at a subdomain of their own, e.g. to preview a built website.
        </span>
      </span>
    </label>
  }

  <div class="space-y-4">
    <button
      id="uploadBtn"
      pButton
      class="w-full justify-center"
      [disabled]="!selectedFile() || uploading()"
      (click)="upload()"
    >
      <span pButtonLabel>{{ uploading() ? 'UPLOADING...' : 'UPLOAD' }}</span>
    </button>

    @if (uploading()) {
      <button
        id="cancelBtn"
        pButton
        severity="danger"
        [outlined]="true"
        class="w-full justify-center"
        (click)="cancel($event)"
      >
        <span pButtonLabel>CANCEL UPLOAD</span>
      </button>
    }
  </div>
}
