<p-dialog
  header="Token issued"
  [modal]="true"
  [visible]="visible()"
  (onHide)="close()"
  [style]="{ width: '42rem' }"
>
  <p-message severity="warn" styleClass="w-full mb-4">
    This is the only time the secret is shown. Copy it now — it cannot be recovered.
  </p-message>

  <div class="flex flex-col gap-1 mb-4">
    <span class="text-xs font-bold uppercase">Token</span>
    <div class="flex gap-2 items-start">
      <code
        class="flex-1 break-all text-sm p-3 rounded bg-surface-100 dark:bg-surface-800"
        data-testid="token-secret"
        >{{ secret() }}</code
      >
      <button pButton size="small" [outlined]="true" (click)="copy(secret() ?? '')">
        <span pButtonLabel>Copy</span>
      </button>
    </div>
  </div>

  <div class="flex flex-col gap-1 mb-4">
    <span class="text-xs font-bold uppercase">Add it to Claude Code</span>
    <div class="flex gap-2 items-start">
      <pre
        class="flex-1 overflow-x-auto text-xs p-3 rounded bg-surface-100 dark:bg-surface-800"
      ><code>{{ command() }}</code></pre>
      <button pButton size="small" [outlined]="true" (click)="copy(command())">
        <span pButtonLabel>Copy</span>
      </button>
    </div>
  </div>

  <div class="flex justify-between items-center">
    <span class="text-xs font-bold uppercase text-green-600">
      @if (copied()) {
        Copied to clipboard
      }
    </span>
    <button pButton (click)="close()">
      <span pButtonLabel>Done</span>
    </button>
  </div>
</p-dialog>
