<div class="w-full max-w-[493px] flex flex-col items-center">
  <img src="/static/logo.png" alt="Send.it logo" style="width: 50%" class="mb-2" />

  <p-card styleClass="w-full">
    <header class="mb-6 pb-2 text-center">
      <h1 class="text-xl font-bold uppercase">FILE READY</h1>
    </header>

    <div class="space-y-4">
      <p-message severity="success" styleClass="w-full font-bold">UPLOAD COMPLETE</p-message>

      <!-- Download -->
      <div>
        <label class="text-[10px] font-bold block mb-1">DOWNLOAD LINK</label>
        <p-inputgroup>
          <input id="res-url" pInputText readonly class="text-sm" [value]="downloadUrl()" #resUrl />
          <button pButton severity="secondary" (click)="copy(resUrl)">
            <span pButtonLabel>COPY</span>
          </button>
        </p-inputgroup>
      </div>

      <!-- Delete -->
      <div>
        <label class="text-[10px] font-bold block mb-1">DELETION LINK (PRIVATE)</label>
        <p-inputgroup>
          <input
            id="res-del"
            pInputText
            readonly
            class="text-sm text-red-600"
            [value]="deleteUrl()"
            #resDel
          />
          <button pButton severity="secondary" (click)="copy(resDel)">
            <span pButtonLabel>COPY</span>
          </button>
        </p-inputgroup>
      </div>

      <!-- Actions -->
      <div class="pt-4 flex justify-between">
        <a href="/" class="text-xs underline">NEW UPLOAD</a>
      </div>
    </div>
  </p-card>

  <p class="mt-1 text-[10px] uppercase font-bold text-surface-500">
    A service forked off
    <a href="https://git.brammie15.dev/brammie15/ReSendit" target="_blank">ReSendit</a>]
  </p>
</div>

<a href="/dashboard" class="fixed bottom-1 right-1 text-[10px] underline">SUDO</a>
<a href="/static/TOS.txt" class="fixed bottom-1 left-1 text-[10px] underline">TOS</a>
