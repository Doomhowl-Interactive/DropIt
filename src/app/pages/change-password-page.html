<div class="max-w-7xl mx-auto">
  <header class="mb-6 pb-4 flex justify-between items-start">
    <div>
      <h1 class="text-4xl font-black uppercase tracking-tighter leading-none">Change password</h1>
      <p class="text-sm mt-2 text-surface-500">Set a new password for your account.</p>
    </div>
    <div class="flex flex-col items-end gap-2">
      <a href="/dashboard" class="text-sm font-bold underline">← Back</a>
      <a href="/logout" class="text-sm font-bold underline text-red-600">Logout</a>
    </div>
  </header>

  @if (error()) {
    <p-message severity="error" styleClass="w-full mb-4">{{ error() }}</p-message>
  }

  @if (done()) {
    <p-message severity="success" styleClass="w-full mb-4">Password updated.</p-message>
  }

  <p-card>
    <form class="flex flex-col gap-4 max-w-md" (submit)="$event.preventDefault(); change()">
      <div class="flex flex-col gap-1">
        <label for="new-password" class="text-xs font-bold uppercase">New password</label>
        <input
          id="new-password"
          pInputText
          type="password"
          required
          minlength="6"
          autocomplete="new-password"
          class="w-full"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          name="newPassword"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="confirm-password" class="text-xs font-bold uppercase">Confirm password</label>
        <input
          id="confirm-password"
          pInputText
          type="password"
          required
          minlength="6"
          autocomplete="new-password"
          class="w-full"
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
          name="confirmPassword"
        />
      </div>

      <button
        type="submit"
        pButton
        class="w-fit"
        [disabled]="busy() || !newPassword() || !confirmPassword()"
      >
        <span pButtonLabel>Change password</span>
      </button>
    </form>
  </p-card>
</div>
