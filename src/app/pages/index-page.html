<!--<div class="w-full max-w-[493px] flex flex-col items-end">-->
<div class="w-full max-w-[493px] flex flex-col items-center">
  <img
    src="/static/logo.png"
    draggable="false"
    alt="Send.it logo"
    style="width: 50%"
    class="mb-2 border-black"
  />
  <div class="box">
    <header class="mb-6 border-b-2 border-black pb-2 text-center">
      <h1 class="text-xl font-bold uppercase">Drop it</h1>
    </header>

    <div id="upload-ui">
      <div
        id="drop-zone"
        class="drop-zone mb-4"
        [class.active]="dragging()"
        (click)="fileInput.click()"
        (dragover)="onDragOver($event)"
        (dragleave)="dragging.set(false)"
        (drop)="onDrop($event)"
      >
        <input type="file" id="fileInput" class="hidden" #fileInput (change)="onFileSelected()" />

        <div id="dz-content">
          <span id="dz-text" class="text-sm">{{ dropZoneText() }}</span>
        </div>

        <div
          id="progress-container"
          class="mt-3 border border-black h-4"
          [class.hidden]="!uploading()"
        >
          <div id="progress-bar" class="h-full bg-black" [style.width.%]="percent()"></div>
        </div>

        <div class="flex justify-between items-center mt-1">
          <div id="progress-text" class="text-[10px] font-bold" [class.hidden]="!uploading()">
            {{ percent() }}%
          </div>
          <div id="stats-text" class="text-[10px] font-bold uppercase" [class.hidden]="!uploading()">
            <span id="speed-text">{{ speed() }}</span>
            <span class="mx-1 opacity-30">|</span>
            <span id="eta-text">{{ eta() }}</span>
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div class="flex items-center justify-between border-b border-black pb-2">
          <label class="text-xs font-bold uppercase">Expire In:</label>
          <select id="duration" class="border border-black text-xs p-1">
            <option value="-1">Heat death of the universe</option>
          </select>
        </div>

        <button
          id="uploadBtn"
          class="w-full"
          [disabled]="!selectedFile() || uploading()"
          (click)="upload()"
        >
          {{ uploading() ? 'UPLOADING...' : 'UPLOAD' }}
        </button>
        <button
          id="cancelBtn"
          class="btn-cancel"
          [class.hidden]="!uploading()"
          (click)="cancel($event)"
        >
          CANCEL UPLOAD
        </button>
      </div>
    </div>
  </div>

  <p class="mt-1 text-[10px] uppercase font-bold text-black">
    A service forked off
    <a class="text-red-500" href="https://git.brammie15.dev/brammie15/ReSendit" target="_blank"
      >ReSendit</a
    >
  </p>
</div>

<a href="/admin" class="fixed bottom-1 right-1 text-[10px] underline">SUDO</a>
