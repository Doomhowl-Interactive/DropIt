<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        * { border-radius: 0 !important; }

        body {
            font-family: sans-serif;
            background: #fff;
            color: #000;
            padding: 20px;
        }

        .box {
            border: 2px solid #000;
            background: #fff;
        }

        input {
            border: 1px solid #000;
            padding: 6px;
            font-size: 13px;
            width: 100%;
            background: #fff;
        }

        input:focus {
            outline: none;
            background: #f9f9f9;
        }

        button {
            border: 1px solid #000;
            background: #eee;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        button:hover {
            background: #000;
            color: #fff;
        }

        .nav-link {
            font-weight: bold;
            text-decoration: underline;
            font-size: 11px;
        }

        .label {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .error {
            border: 1px solid #000;
            background: #ffcccc;
            font-size: 11px;
            padding: 4px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="max-w-md mx-auto">

    <header class="mb-8 border-b-4 border-black pb-2 flex justify-between items-end">
        <h1 class="text-3xl font-black uppercase tracking-tighter">
            System Access
        </h1>

        <a href="/" class="nav-link">
            ← BACK
        </a>
    </header>


    <div class="box p-4">

        {{if .Error}}
        <div class="error">
            ACCESS DENIED
        </div>
        {{end}}

        <form id="login-form" class="space-y-3">

            <div>
                <div class="label">Username</div>
                <input id="username" required autocomplete="username">
            </div>

            <div>
                <div class="label">Password</div>
                <input id="password" type="password" required autocomplete="current-password">
            </div>

            <div class="pt-2">
                <button type="submit">
                    AUTHENTICATE
                </button>
            </div>

        </form>

    </div>
</div>

<script>
    const form = document.getElementById("login-form");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {
            const m = document.cookie.match('(^|;)\\s*csrf_token\\s*=\\s*([^;]+)');
            const csrf = m ? m.pop() : '';

            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-Token": csrf
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await res.json();

            if (!res.ok) {
                showError();
                return;
            }

            // Redirect to admin
            window.location.href = "/admin";

        } catch (err) {
            showError();
        }
    });

    function showError() {
        let err = document.getElementById("error-box");
        if (!err) {
            err = document.createElement("div");
            err.id = "error-box";
            err.className = "error";
            err.innerText = "ACCESS DENIED";
            form.prepend(err);
        }
    }
</script>

</body>
</html>
