<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — File Not Found</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            border-radius: 0 !important;
            transition: none !important;
        }

        body {
            font-family: sans-serif;
            background: #fff;
            color: #000;
        }

        .box {
            border: 2px solid #000;
            padding: 20px;
            background: #fff;
            width: 100%;
        }

        button, .button {
            border: 2px solid #000;
            background: #eee;
            padding: 4px 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .button:hover {
            background: #ccc;
        }

        button:active, .button:active {
            background: #000;
            color: #fff;
        }

        .error-code {
            font-size: 64px;
            font-weight: 900;
            border-bottom: 2px solid #000;
            margin-bottom: 10px;
        }

        .error-text {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-[493px] flex flex-col items-center">

    <div class="box text-center">

        <div class="error-code">404</div>

        <div class="error-text mb-4">
            FILE NOT FOUND 💀
        </div>

        <div class="text-xs mb-6 uppercase">
            The requested file does not exist,<br>
            has expired, or was obliterated,<br>or my db is fucked.
            We'll never know :D
        </div>

        <div class="flex flex-col gap-2">
            <a href="/" class="button w-full">RETURN TO UPLOADER</a>
        </div>

    </div>


</div>

</body>
</html>
