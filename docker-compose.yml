version: "3.9"

services:
  sendit:
    build: .
    container_name: sendit
    ports:
      - "8000:8000"

    environment:
      JWT_SECRET: supersecretkey
      PORT: 8000
      ADMIN_PASSWORD: ""

      DB_TYPE: sqlite
      DATABASE_URL: ./data/database.db

      DOMAIN: ""
      USE_HTTPS: "false"

    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

    restart: unless-stopped