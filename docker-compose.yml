services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306'

    environment:
      MYSQL_DATABASE: dropit
      MYSQL_USER: dropit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - dropit-mysql:/var/lib/mysql

    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  dropit:
    build: .
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - '3400:3400'

    environment:
      PORT: 3400
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-mysql://dropit:${MYSQL_PASSWORD}@mysql:3306/dropit}

      # Uploads land on the volume below; set S3_BUCKET (plus S3_ENDPOINT,
      # S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY) to store them in an
      # S3-compatible bucket instead.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-}
      STORAGE_DIR: /app/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      STATIC_DIR: ./static
      MCP_MAX_BODY: 35mb
      MCP_MAX_UPLOAD_BYTES: 26214400

    volumes:
      - dropit-uploads:/app/uploads

volumes:
  dropit-uploads:
  dropit-mysql:
