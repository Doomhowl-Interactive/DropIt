services:
  dropit:
    build: .
    container_name: dropit
    ports:
      - "8080:8080"

    environment:
      JWT_SECRET: supersecretkey
      PORT: 8080
      ADMIN_PASSWORD: ""

      DATABASE_URL: postgres://dropit:dropit@postgres:5432/dropit
      STORAGE_DIR: ./uploads

      DOMAIN: ""
      USE_HTTPS: "false"

      # Comma-separated Host allow-list; "*" accepts anything.
      ALLOWED_HOSTS: "*"
      # Set to true when a reverse proxy in front terminates TLS.
      TRUST_PROXY_HEADERS: "false"

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: dropit-postgres
    environment:
      POSTGRES_USER: dropit
      POSTGRES_PASSWORD: dropit
      POSTGRES_DB: dropit
    volumes:
      - dropit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dropit-postgres:
