# Coolify (prod) deployment — this is the default Docker Compose location
# Coolify looks for. Unlike docker-compose.dev.yml (local dev), there is no
# bundled database service here — the app connects to an existing TiDB (or
# MySQL) instance via DATABASE_URL.
#
# Coolify scans this file for ${VAR} references and turns each one into an
# environment variable field in its UI, so set JWT_SECRET, DATABASE_URL,
# ALLOWED_HOSTS and DOMAIN there rather than committing values here.

services:
  dropit:
    build: .
    restart: unless-stopped

    ports:
      - '8080:8080'

    environment:
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080

      # TiDB speaks the MySQL protocol, e.g.:
      #   mysql://user:pass@host:4000/dropit
      # TiDB Cloud requires TLS; append this query string to DATABASE_URL:
      #   ?ssl=%7B%22rejectUnauthorized%22%3Atrue%7D
      # For CA-verified TLS instead, mount the provider's PEM (Coolify ->
      # Storages) and add a DATABASE_SSL_CA env var pointing at its path.
      DATABASE_URL: ${DATABASE_URL}

      STORAGE_DIR: /app/uploads

      DOMAIN: ${DOMAIN:-}
      USE_HTTPS: 'true'
      # Coolify's proxy terminates TLS in front of this container.
      TRUST_PROXY_HEADERS: 'true'

      ALLOWED_HOSTS: ${ALLOWED_HOSTS}

      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_MAX_BODY: ${MCP_MAX_BODY:-35mb}
      MCP_MAX_UPLOAD_BYTES: ${MCP_MAX_UPLOAD_BYTES:-26214400}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}

    volumes:
      - dropit-uploads:/app/uploads

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8080/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dropit-uploads:
