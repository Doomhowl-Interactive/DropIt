services:
  dropit:
    build: .
    container_name: dropit
    ports:
      - "8080:8080"

    environment:
      JWT_SECRET: supersecretkey
      PORT: 8080
      ADMIN_PASSWORD: ""

      DB_TYPE: sqlite
      DATABASE_URL: ./data/database.db
      STORAGE_DIR: ./uploads

      DOMAIN: ""
      USE_HTTPS: "false"

      # Comma-separated Host allow-list; "*" accepts anything.
      ALLOWED_HOSTS: "*"
      # Set to true when a reverse proxy in front terminates TLS.
      TRUST_PROXY_HEADERS: "false"

    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

    restart: unless-stopped
