# fly.toml app configuration file generated for dropit on 2026-08-11T02:20:58+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dropit'
primary_region = 'fra'

[build]
[env]
  ALLOWED_HOSTS = 'dropit.doomhowl.com'
  # Set by `fly postgres attach` as a secret; not listed here since [env] is
  # plaintext and committed to source control.
  NODE_ENV = 'production'
  PORT = '8080'
  STORAGE_DIR = '/data/uploads'
  TRUST_PROXY_HEADERS = 'true'
  USE_HTTPS = 'true'

[[mounts]]
  source = 'dropit_data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  # Not 'suspend'. A suspended machine is not stopped, it is snapshotted: it resumes with the
  # same Node process and the same database pool it had before, and those connections are long
  # dead by the time anything wakes it. The first request in then blocks on a socket nobody is
  # listening to until the read times out — 110 seconds, measured — and the caller has usually
  # given up by then. A stop is a real cold start, new process and new pool. The proxy holds
  # the request while it boots, so a wake costs the caller about nine seconds and answers,
  # rather than a couple of hundred milliseconds and a timeout.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
